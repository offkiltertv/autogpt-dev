# Included in http{} after the existing Cloudflare real-IP configuration.
# Aggregate budgets protect PHP even when every request uses a different IP.
# Empty keys are not counted. Signed-in requests and local health probes keep
# their existing path; all PHP requests also share a bounded in-flight ceiling.
map $http_cookie $oktv_has_session_cookie {
    default 0;
    ~*(wordpress_logged_in_|wordpress_sec_|wp-postpass_) 1;
}

map "$remote_addr:$oktv_has_session_cookie:$request_method" $oktv_public_read_key {
    default "";
    ~^(127\.0\.0\.1|::1): "";
    ~:0:(GET|HEAD)$ public;
}

map "$oktv_public_read_key:$arg_sort_by:$arg_random_query" $oktv_variant_key {
    default "";
    ~^public:[^:]+: variants;
    ~^public::.+ variants;
}

limit_req_zone $oktv_public_read_key zone=oktv_public_read:1m rate=6r/s;
limit_req_zone $oktv_variant_key zone=oktv_query_variants:1m rate=2r/s;
limit_conn_zone $oktv_public_read_key zone=oktv_public_inflight:1m;
limit_conn_zone $oktv_variant_key zone=oktv_variant_inflight:1m;
limit_conn_zone $server_name zone=oktv_php_inflight:1m;
map $uri $oktv_cron_key {
    default "";
    /wp-cron.php cron;
}
limit_conn_zone $oktv_cron_key zone=oktv_cron_inflight:1m;

limit_conn_status 429;
limit_conn_log_level warn;

# Timing logs retain route families and admission decisions, without query
# strings, cookies, authorization headers, request bodies or account identifiers.
map $request_uri $oktv_route_family {
    default other;
    ~^/(\?|$) home;
    ~^/video(/|\?|$) video;
    ~^/video-category(/|\?|$) video_category;
    ~^/channel(/|\?|$) channel;
    ~^/participants(/|\?|$) participants;
    ~^/tag(/|\?|$) tag;
    ~^/wp-admin(/|\?|$) administration;
    ~^/wp-json(/|\?|$) api;
    ~^/wp-cron\.php(\?|$) cron;
}
log_format oktv_admission '$time_iso8601 method=$request_method '
                          'route=$oktv_route_family status=$status '
                          'request_time=$request_time upstream_time=$upstream_response_time '
                          'rate=$limit_req_status concurrency=$limit_conn_status';
