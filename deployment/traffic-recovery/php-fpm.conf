index index.html index.htm index.php;

# WordPress's normal cron lock does not prevent duplicate HTTP requests from
# occupying the PHP queue. Admit one cron request; the next scheduled run retries.
location = /wp-cron.php {
    try_files $uri =404;
    limit_conn oktv_cron_inflight 1;
    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_pass unix:/opt/bitnami/php/var/run/www.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    include fastcgi_params;
    access_log /opt/bitnami/nginx/logs/oktv-timing.log oktv_admission;
}

location ~ \.php$ {
    # Nonexistent PHP files are scanner noise, not application requests.
    try_files $uri =404;
    limit_req zone=oktv_dynamic burst=30 nodelay;
    limit_req zone=oktv_public_read burst=10 nodelay;
    limit_req zone=oktv_query_variants burst=4 nodelay;
    limit_conn oktv_php_inflight 24;
    limit_conn oktv_public_inflight 12;
    limit_conn oktv_variant_inflight 4;
    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_pass unix:/opt/bitnami/php/var/run/www.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    include fastcgi_params;
    access_log /opt/bitnami/nginx/logs/oktv-timing.log oktv_admission;
}
